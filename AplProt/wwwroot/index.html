<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шифрование сообщений</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="min-vh-100 d-flex align-items-center">

    <div class="container">
        <div class=" bg-body-tertiary " >
            <div class=" bg-primary text-white text-center py-4 border-primary">
                <h3 class="fw-semibold">Ляба:)</h3>
            </div>
            <div class="card-body p-4">
                <form id="encryptForm" novalidate>
                    <div class="mb-3">
                        <label for="type" class="py-1 text-light">Тип шифрования</label>
                        <select class="form-select bg-dark text-light border-secondary" id="type" name="type">
                            <option value="">Туть пока ничего</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="key_code" class="py-1 text-light ">Ключ шифрования</label>
                        <div class="input-group">
                            <input type="text" class="form-control bg-dark text-light border-secondary"
                                   id="key_code" name="key_code" placeholder="Введите ключ">
                            <button type="button" class="btn btn-outline-primary" id="btnGenKey">gen</button>
                        </div>
                        
                        <div id="key_feedback"></div>
                    </div>

                    <div class="mb-3">
                        <label for="text_message" class="form-label text-light fw-medium">Текст сообщения</label>
                        <input type="text" class="form-control bg-dark text-light border-secondary"
                               id="text_message" name="text_message" placeholder="Введите текст для шифрования">
                        <div id="msg_feedback"></div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="button" class="btn btn-primary btn-lg" id="btnEncrypt">Зашифровать</button>
                        <button type="button" class="btn btn-primary btn-lg" id="btnDecrypt">Дешифровать</button>
                    </div>
                </form>



                <h5 class="text-light mb-3">Результат:</h5>
                <div id="result" class="bg-dark border border-secondary rounded p-3 text-light font-monospace"
                     style="min-height:100px;">
                    <span class="text-secondary"> Результат пока нет:(</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="TypeGet.js"></script>
    <script src="Encrypt.js"></script>
</body>
</html>
